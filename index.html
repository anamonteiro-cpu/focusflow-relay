<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusFlow Auth Relay</title>
  <style>
    body { font-family: sans-serif; background: #0f1117; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; text-align: center; }
    p { font-size: 18px; }
  </style>
</head>
<body>
  <p>🔄 Conectando ao FocusFlow...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const payload = {
      type:  'focusflow_oauth',
      code:  params.get('code'),
      state: params.get('state'),
      error: params.get('error')
    };
    if (window.opener) {
      window.opener.postMessage(payload, 'https://work.toqan.ai');
      document.querySelector('p').textContent = '✅ Conectado! Esta aba vai fechar...';
      setTimeout(() => window.close(), 1500);
    } else {
      document.querySelector('p').textContent = '❌ Abra esta página a partir do FocusFlow.';
    }
  </script>
</body>
</html>
